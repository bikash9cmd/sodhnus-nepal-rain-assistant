name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: cfn-lint infra/template.yaml
      - run: python -m pytest -q
      # Regressions in routing, numbers or refusals show up here before they reach anyone.
      - run: python eval/run_eval.py
      - run: python eval/checker_mutations.py
